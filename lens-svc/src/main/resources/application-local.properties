# ============================================================
# LOCAL profile — zero-install SQLite database.
# Schema is auto-created by Hibernate (ddl-auto=update) and
# seed-local.sql runs on every startup (idempotent inserts).
# Run:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# DB file: lens-local.db in the working directory.
# ============================================================

spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:lens-local.db
spring.datasource.username=
spring.datasource.password=

# sqlite-jdbc's getColumns() metadata query overflows SQLite's compound-SELECT
# limit on this many tables, so Hibernate cannot read table metadata.
# => schema is script-managed: schema-local.sql + seed-local.sql run at startup
#    (both idempotent / continue-on-error) and metadata access is disabled.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-local.sql
spring.sql.init.data-locations=classpath:seed-local.sql,classpath:seed-local-data.sql
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=false

logging.level.org.springframework.security=INFO
swagger.url.patterns=/swagger-ui/index.html,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**,/swagger-resources/**,/webjars/**
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-post-size=52428800 # 50MB

file.upload.dir.ofm=./uploads/ofm
file.salesInquiryUploadDirectory=./uploads/salesInquiry
file.pumpSealUploadDirectory=./uploads/pumpseal
file.AgitatoryUploadDirectory=./uploads/agitator
file.RotaryjointUploadDirectory=./uploads/rotaryjoint
file.ApiPlanUploadDirectory=./uploads/apiplan

apiplan=apiplan
pumpseal=pumpseal
agitator=agitator
rotaryjoint=rotaryjoint
salesInquiryfile=salesInquiryfile

# DEV-ONLY fallback secret so `local` runs with no env vars.
# Override with JWT_SECRET env var; never used outside local profile.
# NOTE: JwtService base64-decodes this — only [A-Za-z0-9+/=] chars allowed.
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktbG9jYWwtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZA==}
jwt.expiration=${JWT_EXPIRATION:86400000}

security.endpoint.config.enabled=true
security.endpoint.config.file=auth-config.json

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

SAL.prefix=SAL/
PUM.prefix=/PUM/
AGT.prefix=/AGT/
API.prefix=/API/
ROT.prefix=/ROT/
CUST.prefix=CUST/
CONT.prefix=/CONT/

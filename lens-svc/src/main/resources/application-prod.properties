
#spring.config.additional-location=C:\D-DISK\configuration\application.properties\


#external.config.path=C:/D-DISK/configuration/application-secret
spring.config.import=optional:file:C:/CRM/opt/prod/configuration/application-secret.properties



# Enable SQL logging-
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.org.springframework.security=TRACE
# Maximum file size
spring.servlet.multipart.max-file-size=50MB
# Maximum request size
spring.servlet.multipart.max-request-size=50MB
# Tomcat-specific settings
server.tomcat.max-http-post-size=52428800 # 50MB

file.upload.dir.ofm=C:\\CRM\\opt\\dev\\omfiles
file.salesInquiryUploadDirectory=C:\\CRM\\opt\\dev\\salesInquiryfile
file.pumpSealUploadDirectory=C:\\CRM\\opt\\dev\\pumpsealfile
file.AgitatoryUploadDirectory=C:\\CRM\\opt\\dev\\agitatorfile
file.RotaryjointUploadDirectory=C:\\CRM\\opt\\dev\\Rotaryjointfile
file.ApiPlanUploadDirectory=C:\\CRM\\opt\\dev\\apiplanfile

apiplan=apiplan
pumpseal=pumpseal
agitator=agitator
rotaryjoint=rotaryjoint
salesInquiryfile=salesInquiryfile



# Swagger/OpenAPI Configuration
swagger.url.patterns=/swagger-ui/index.html,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**,/swagger-resources/**,/webjars/**

# Public endpoints that don't require authentication
public.endpoints=/auth/authenticate,/auth/resetPassword,/user/**,/actuator/health



security.endpoint.config.enabled=true

security.endpoint.config.file=auth-config.json

# Comma-separated list of allowed CORS origins - must be set via environment in prod
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
logging.level.org.springframework.boot.context.config=DEBUG
SAL.prefix=SAL/
PUM.prefix=/PUM/
AGT.prefix=/AGT/
API.prefix=/API/
ROT.prefix=/ROT/
CUST.prefix=CUST/
CONT.prefix=/CONT/


